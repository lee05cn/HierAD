[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierad"
version = "0.2.0"
description = "HierAD - hierarchical audio description pipeline (VLM + LLM) for video"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tqdm>=4.66.0"]
asr = ["openai-whisper>=20231117"]
actor_db_vectors = ["faiss-cpu>=1.7.0", "insightface>=0.7.0", "onnxruntime-gpu>=1.15.0", "opencv-python>=4.8.0"]
describe_extras = ["sentence-transformers>=2.2.0", "scikit-learn>=1.0.0", "scenedetect>=0.6.0", "opencv-python-headless>=4.8.0"]
cloud = ["dashscope>=1.20.0"]
scene_detect = ["scenedetect>=0.6.0", "opencv-python-headless>=4.8.0"]
full = [
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "scenedetect>=0.6.0",
    "opencv-python>=4.8.0",
    "Pillow>=9.5.0",
    "openai-whisper>=20231117",
    "faiss-cpu>=1.7.0",
    "insightface>=0.7.0",
    "dashscope>=1.20.0",
]

[project.scripts]
hierad = "hierad.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hierad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
