<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>声眸 · 层次化无障碍视频描述</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
<style>
  /* ============================================================
     封面页：整页只有字标 + 小标题（2026-10-12 改版）。
     原先堆在这里的内容——对白间隙示意图、指标带、六张优势卡、原理三步——
     整体搬到了 /features（"看看它强在哪"）。想加回首页的东西请先想清楚：
     首页的力气全在「一句话 + 一次入场」，多一样都会散。
     ============================================================ */
  .shell { max-width: 1020px; }

  /* 顶部环境光：正中一团蓝晕把字标托住，右上角一点靛色补空气感 */
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(56% 42% at 50% 30%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 72%),
      radial-gradient(42% 32% at 84% 6%, color-mix(in srgb, var(--accent-2) 8%, transparent) 0%, transparent 74%);
    background-repeat: no-repeat;
    background-attachment: fixed;

    /* 内容只有两行，所以让 body 撑满一屏、cover 吃掉剩余高度，页脚自然落到最底 */
    min-height: 100vh;    /* 老引擎兜底：不认 svh 的会忽略下一行 */
    min-height: 100svh;   /* 移动端地址栏收起时不至于把页脚顶出屏幕 */
    display: flex;
    flex-direction: column;
  }

  .cover {
    flex: 1;
    display: flex; align-items: center;      /* 竖直居中 */
    padding-top: var(--sp-6);
    padding-bottom: var(--sp-5);
    text-align: center;
  }
  .cover-inner { width: 100%; }

  /* 渐变文字：实色兜底 + @supports 渐进增强，理由见 index.html 里的注释
     （没有兜底时 background-clip:text 一失效，字会变成隐形但占位） */
  .wordmark {
    margin: 0;
    font-size: clamp(68px, 15vw, 156px);
    font-weight: 700; letter-spacing: .08em; line-height: .9;
    color: var(--fg);
  }
  @supports ((background-clip: text) or (-webkit-background-clip: text)) {
    .wordmark {
      /* 两条 background：第一条不含 color-mix，纯色端点，永远有效。
         color-mix 不被支持时整条声明会被判为无效丢掉，而下面那行
         -webkit-text-fill-color:transparent 照样生效 → 字直接隐形，
         和 10-12 修掉的那个坑是同一个失效模式，只是触发条件换了。
         支持的引擎会用第二条覆盖第一条。 */
      background: linear-gradient(150deg, var(--fg) 30%, var(--accent) 100%);
      background: linear-gradient(150deg, var(--fg) 30%, color-mix(in srgb, var(--accent) 72%, var(--fg)) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
  }
  @media (forced-colors: active) {
    .wordmark { background: none; -webkit-text-fill-color: currentColor; color: var(--fg); }
  }

  .tagline {
    margin: 22px 0 0;
    color: var(--fg-soft);
    font-size: clamp(15px, 1.9vw, 18px); font-weight: 550; letter-spacing: .01em;
  }
  /* 字标下面那道渐变短线：从中间往两边长出来，收尾这一下比整块淡入更"立得住" */
  .tagline::after {
    content: ""; display: block;
    width: 52px; height: 3px; border-radius: var(--r-full);
    background: var(--grad);
    margin: 22px auto 0;
    transform-origin: center;
    animation: growX .7s cubic-bezier(.22, .72, .24, 1) backwards;
    animation-delay: .62s;
  }
  @keyframes growX { from { transform: scaleX(0); } }

  /* 封面没有内容可滚，页脚直接贴底，不留 88px 的段落间距 */
  .foot { margin-top: 0; }

  @media (max-width: 560px) {
    .cover { padding-top: var(--sp-5); }
  }
</style>
</head>
<body>

<header class="topbar drop d1">
  <div class="shell">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/>
        </svg>
      </span>
      <a class="home" href="/">声眸</a>
      <span class="tag">层次化无障碍视频描述</span>
    </div>
    <nav class="topbar-right">
      <a class="navlink" href="/features">看看它强在哪</a>
      <a class="btn primary sm" href="/app">开始生成</a>
      <button id="themeBtn" aria-label="切换深浅色">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="shell cover">
  <div class="cover-inner">
    <h1 class="wordmark blur-in d2">声眸</h1>
    <p class="tagline rise d5">层次化无障碍视频描述</p>
  </div>
</main>

<footer class="shell foot">
  <span>声眸 · 层次化无障碍视频描述</span>
  <span>局域网服务 · 需登录使用</span>
</footer>

</body>
</html>
