<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>登录 · HierAD</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
<style>
  /* 登录页：单独一屏，不参与 topbar 的用户槽注入（body[data-no-user-slot]） */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .auth-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: var(--sp-7) 0 var(--sp-8);
  }
  .auth-card { width: 100%; max-width: 420px; }

  .auth-head { text-align: center; margin-bottom: var(--sp-5); }
  .auth-head .mark {
    width: 46px; height: 46px; border-radius: 13px; margin: 0 auto var(--sp-3);
    background: var(--grad); color: #fff; display: grid; place-items: center;
    box-shadow: var(--sh-glow);
  }
  .auth-head .mark svg { width: 24px; height: 24px; }
  .auth-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .auth-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  /* Tab */
  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: var(--sp-5);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  .tab {
    flex: 1; padding: 8px 12px; border: 0; border-radius: var(--r-sm);
    background: transparent; color: var(--muted-strong);
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .tab:hover:not(.on) { background: transparent; color: var(--fg); }
  .tab.on { background: var(--surface); color: var(--fg); box-shadow: var(--sh-1); }

  .field { margin-bottom: var(--sp-4); }
  .field label {
    display: block; margin-bottom: 6px;
    font-size: 13px; font-weight: 600; color: var(--fg-soft);
  }
  .field input {
    width: 100%; padding: 10px 12px;
    font: inherit; font-size: 14px;
    color: var(--fg); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field .hint { margin-top: 5px; color: var(--muted); font-size: 12px; }

  .auth-card button.primary { width: 100%; padding: 11px 18px; }
  .auth-msg {
    margin: 0 0 var(--sp-4); padding: 9px 12px;
    border-radius: var(--r-sm); font-size: 13px; line-height: 1.6;
    background: var(--err-bg); color: var(--err); border: 1px solid transparent;
  }
  .auth-msg.ok { background: var(--accent-soft); color: var(--accent); }

  .foot { margin-top: 0; padding: 0; border: 0; justify-content: center; }

  @media (max-width: 600px) {
    .auth-wrap { padding: var(--sp-6) 0; align-items: flex-start; }
  }
</style>
</head>
<body data-no-user-slot>

<header class="topbar drop d1">
  <div class="shell">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/>
        </svg>
      </span>
      <a class="home" href="/">HierAD</a>
      <span class="tag">层次化无障碍视频描述</span>
    </div>
    <nav class="topbar-right">
      <a class="navlink" href="/features">看看它强在哪</a>
      <button id="themeBtn" aria-label="切换深浅色">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <div class="shell auth-card rise d2">
    <div class="card">
      <div class="auth-head">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/>
          </svg>
        </span>
        <h1 id="authTitle">登录 HierAD</h1>
        <p id="authSub">使用团队账号进入生成工作台</p>
      </div>

      <div class="tabs hidden" id="tabs" role="tablist">
        <button class="tab on" id="tabLogin" type="button" role="tab">登录</button>
        <button class="tab" id="tabRegister" type="button" role="tab">注册</button>
      </div>

      <p class="auth-msg hidden" id="msg" role="alert"></p>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 required minlength="3" maxlength="32" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required minlength="8" maxlength="128">
          <div class="hint hidden" id="pwHint">至少 8 位</div>
        </div>

        <div class="field hidden" id="codeField">
          <label for="code">邀请码</label>
          <input id="code" name="code" type="text" autocomplete="off" spellcheck="false">
          <div class="hint">本服务需要邀请码才能注册</div>
        </div>

        <button class="primary" id="submitBtn" type="submit">登录</button>
      </form>
    </div>

    <footer class="shell foot" style="margin-top: var(--sp-5);">
      <span>HierAD · 层次化无障碍视频描述</span>
    </footer>
  </div>
</main>

<script>
(function () {
  "use strict";

  var cfg = { allow_registration: false, require_code: false, has_users: false };
  var mode = "login";

  var tabLogin = document.getElementById("tabLogin");
  var tabRegister = document.getElementById("tabRegister");
  var tabs = document.getElementById("tabs");
  var title = document.getElementById("authTitle");
  var sub = document.getElementById("authSub");
  var msg = document.getElementById("msg");
  var form = document.getElementById("form");
  var username = document.getElementById("username");
  var password = document.getElementById("password");
  var codeField = document.getElementById("codeField");
  var code = document.getElementById("code");
  var pwHint = document.getElementById("pwHint");
  var submitBtn = document.getElementById("submitBtn");

  // 只接受站内路径，挡掉 //evil.com 之类的开放重定向
  function nextPath() {
    var q = new URLSearchParams(location.search);
    var next = q.get("next") || "/app";
    if (next.charAt(0) !== "/" || next.charAt(1) === "/") next = "/app";
    return next;
  }

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = "auth-msg" + (ok ? " ok" : "");
  }

  function hideMsg() { msg.className = "auth-msg hidden"; }

  function setMode(next) {
    mode = next === "register" ? "register" : "login";
    var reg = mode === "register";
    tabLogin.classList.toggle("on", !reg);
    tabRegister.classList.toggle("on", reg);
    title.textContent = reg ? "注册 HierAD" : "登录 HierAD";
    sub.textContent = reg
      ? (cfg.has_users ? "新账号只能看到自己的任务" : "第一个注册的账号将成为管理员")
      : "使用团队账号进入生成工作台";
    submitBtn.textContent = reg ? "注册并登录" : "登录";
    password.setAttribute("autocomplete", reg ? "new-password" : "current-password");
    pwHint.classList.toggle("hidden", !reg);
    codeField.classList.toggle("hidden", !(reg && cfg.require_code));
    hideMsg();
  }

  function setBusy(busy) {
    submitBtn.disabled = busy;
    submitBtn.textContent = busy
      ? (mode === "register" ? "注册中…" : "登录中…")
      : (mode === "register" ? "注册并登录" : "登录");
  }

  tabLogin.addEventListener("click", function () { setMode("login"); });
  tabRegister.addEventListener("click", function () { setMode("register"); });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    hideMsg();

    var u = username.value.trim();
    var p = password.value;
    if (u.length < 3) { showMsg("用户名至少 3 位。"); username.focus(); return; }
    if (p.length < 8) { showMsg("密码至少 8 位。"); password.focus(); return; }

    var body = { username: u, password: p };
    if (mode === "register" && cfg.require_code) body.code = code.value.trim();

    setBusy(true);
    fetch("/api/auth/" + mode, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) {
          throw new Error(data.detail || ("请求失败（" + r.status + "）"));
        }
        return data;
      });
    }).then(function () {
      location.replace(nextPath());
    }).catch(function (err) {
      setBusy(false);
      showMsg(err && err.message ? err.message : "网络错误，请重试。");
    });
  });

  // 读服务端配置：能否注册、是否需要邀请码
  fetch("/api/auth/config", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data) return;
      cfg = data;
      if (cfg.allow_registration) {
        tabs.classList.remove("hidden");
        if (!cfg.has_users) setMode("register");
      }
      if (!cfg.allow_registration && cfg.has_users) {
        sub.textContent = "本服务已关闭自助注册，请使用已有账号登录";
      }
    })
    .catch(function () { /* 配置读不到就按最保守的「仅登录」处理 */ });

  username.focus();
})();
</script>

</body>
</html>
